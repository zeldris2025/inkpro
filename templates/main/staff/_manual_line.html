{% comment %}One line of the hand-written quote form. Also rendered from the
formset's empty form into a <template>, which the "Add line" button clones.{% endcomment %}
<div data-line class="rounded-lg border border-zinc-200 p-4">
  {{ line.id }}
  <div class="mb-3 flex items-center justify-between">
    <span class="text-xs font-bold uppercase tracking-widest text-zinc-400">Line <span data-line-number>{{ number }}</span></span>
    <div class="flex items-center gap-4">
      <span class="text-xs text-zinc-500" data-only="detailed" data-line-area>—</span>
      <span class="text-xs text-zinc-500" data-only="quick">incl. GST</span>
      <span class="font-bold tabular" data-line-total>$0.00</span>
      <button type="button" data-remove class="text-xs font-bold text-zinc-400 hover:text-red-600" title="Remove line">✕ Remove</button>
    </div>
  </div>
  {% for error in line.non_field_errors %}<p class="mb-2 text-xs font-semibold text-red-600">{{ error }}</p>{% endfor %}
  {% comment %}Dense flow lets a quick line's Qty and Total sit beside the
  description, in the gap the hidden Category leaves.{% endcomment %}
  <div class="grid grid-flow-row-dense gap-3 sm:grid-cols-6">
    {% for field in line.visible_fields %}
    <div class="{% if field.name == 'description' %}sm:col-span-4{% elif field.name == 'category' %}sm:col-span-2{% elif field.name == 'customer_brief' %}sm:col-span-6{% endif %}"
         {% if field.name in 'category width_m height_m size rate_per_m2 unit_price' %}data-only="detailed"{% elif field.name == 'total_inc_gst' %}data-only="quick"{% endif %}>
      <label for="{{ field.id_for_label }}" class="mb-1 block text-[10px] font-bold uppercase tracking-widest text-zinc-500">{{ field.label }}</label>
      {{ field }}
      {% for error in field.errors %}<p class="mt-1 text-xs font-semibold text-red-600">{{ error }}</p>{% endfor %}
    </div>
    {% endfor %}
  </div>
</div>
